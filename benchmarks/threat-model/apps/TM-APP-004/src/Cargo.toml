[package]
name = "fileproc"
version = "0.5.2"
edition = "2021"
authors = ["Infrastructure Team <infra@example.com>"]
description = "Config-driven file processing CLI with plugin support"
license = "MIT"
readme = "README.md"

[[bin]]
name = "fileproc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1.35", features = ["full"] }
libloading = "0.8"
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
csv = "1.3"
log = "0.4"
env_logger = "0.10"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
url = "2.5"

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.0"
