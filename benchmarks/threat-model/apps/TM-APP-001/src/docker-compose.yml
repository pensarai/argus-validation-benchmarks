version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tm-app-001
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://tmuser:tmpass@postgres:5432/tmapp?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=1h
      - UPLOAD_DIR=/app/uploads
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: tm-app-001-db
    environment:
      - POSTGRES_USER=tmuser
      - POSTGRES_PASSWORD=tmpass
      - POSTGRES_DB=tmapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmuser -d tmapp"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  uploads:

networks:
  app-network:
    driver: bridge
