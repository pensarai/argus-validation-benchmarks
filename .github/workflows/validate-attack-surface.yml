name: Validate attack-surface

on:
  pull_request:
    paths:
      - "benchmarks/**/attack-surface.json"
      - "attack-surface-schema.json"
      - "scripts/validate-attack-surface.ts"
      - "scripts/bootstrap-attack-surface.ts"
      - "package.json"
      - "bun.lockb"
      - "bun.lock"
      - ".github/workflows/validate-attack-surface.yml"
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate attack-surface catalogs
        run: bun run validate:attack-surface
